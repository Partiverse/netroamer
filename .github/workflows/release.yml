name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        working-directory: netroamerd
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}-${GOOS}-${GOARCH}" \
            -o "../netroamer-${GOOS}-${GOARCH}${{ matrix.ext }}" ./cmd/netroamerd
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netroamer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: netroamer-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          for f in netroamer-*; do shasum -a 256 "$f" >> SHA256SUMS; done
          cat SHA256SUMS
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/netroamer-*
            dist/SHA256SUMS
