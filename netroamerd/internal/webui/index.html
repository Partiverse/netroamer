<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netroamerd 控制台</title>
<style>
  :root {
    --bg: #0f1219; --card: #171c26; --line: #232b3a; --fg: #d8dee9; --dim: #7d8590;
    --green: #3fb950; --yellow: #d29922; --red: #f85149; --blue: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; padding: 24px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
  .card .k { color: var(--dim); font-size: 12px; }
  .card .v { font-size: 20px; font-weight: 600; margin-top: 2px; }
  .card .v.green { color: var(--green); } .card .v.yellow { color: var(--yellow); } .card .v.red { color: var(--red); }
  section { margin-bottom: 28px; }
  h2 { font-size: 15px; margin-bottom: 10px; color: var(--blue); }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--dim); font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 80px; }
  .bar i { display: block; height: 100%; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
  .tag.direct { background: #1a3a2a; color: var(--green); }
  .tag.proxy { background: #1c2a44; color: var(--blue); }
  .tag.action { background: #3a2a1a; color: var(--yellow); }
  .tag.skip { background: #222833; color: var(--dim); }
  .empty { color: var(--dim); padding: 16px; text-align: center; background: var(--card); border-radius: 10px; }
  #refresh { float: right; color: var(--dim); font-size: 12px; }
  pre { background: var(--card); border-radius: 10px; padding: 12px; white-space: pre-wrap; font-size: 12px; overflow-x: auto; }
  .row-click { cursor: pointer; }
  a { color: var(--blue); text-decoration: none; }
</style>
</head>
<body>
<h1>netroamerd 控制台 <span id="mode" class="tag skip"></span></h1>
<div class="sub">本地无感自愈网络层 · 数据全部在本机 · <span id="refresh">每 10s 自动刷新</span></div>

<div class="cards" id="cards"></div>

<section>
  <h2>依赖状态</h2>
  <div id="deps"></div>
</section>

<section>
  <h2>策略组视图（聚合置顶 · 「承载流量」= 该组被选中或有规则引用）</h2>
  <div id="groups"></div>
</section>

<section>
  <h2>镜像替换（哪些服务在走镜像源，来自 bootstrap 实际配置的检测）</h2>
  <div id="mirrors"></div>
</section>

<section>
  <h2>自愈时间线（影子建议 + 正式动作，最新在前）</h2>
  <div id="timeline"></div>
</section>

<section>
  <h2>节点健康（Selector 组，score 越小越健康）</h2>
  <div id="nodes"></div>
</section>

<section>
  <h2>延迟矩阵 TOP（含主动采样回填的真实延迟）</h2>
  <div id="matrix"></div>
</section>

<section>
  <h2>自愈证据（修复前后对照）</h2>
  <div id="evidence"></div>
  <pre id="ev-content" style="display:none"></pre>
</section>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cls = ms => ms < 300 ? "green" : ms < 800 ? "yellow" : "red";

async function j(url) { const r = await fetch(url); return r.json(); }

async function loadOverview() {
  const o = await j("/api/overview");
  $("mode").textContent = o.mode;
  $("mode").className = "tag " + (String(o.mode).startsWith("actuate") ? "action" : "skip");
  const cards = [
    ["版本", esc(o.version)],
    ["运行时长", o.uptime_h.toFixed(1) + "h"],
    ["样本总数", o.total_judged.toLocaleString()],
    ["判定/动作", o.judgments],
    ["带延迟聚合组", "—"],
    ["证据数", o.evidence],
  ];
  $("cards").innerHTML = cards.map(([k, v]) =>
    `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
}

async function loadDeps() {
  const deps = await j("/api/deps");
  const badge = st => st === "ok" ? '<span class="tag direct">正常</span>'
    : st === "warn" ? '<span class="tag action">注意</span>'
    : '<span class="tag" style="background:#3a1a1a;color:var(--red)">异常</span>';
  $("deps").innerHTML = `<table><tr><th>依赖</th><th>状态</th><th>详情</th></tr>` +
    deps.map(d2 => `<tr><td>${esc(d2.name)}</td><td>${badge(d2.state)}</td><td>${esc(d2.detail)}</td></tr>`).join("") + `</table>`;
}

async function loadGroups() {
  const d2 = await j("/api/groups");
  if (!d2.available) { $("groups").innerHTML = `<div class="empty">策略组不可用（mihomo API 未连接）</div>`; return; }
  const rows = d2.groups.map(g => {
    const isAgg = g.name === "聚合";
    let extra = "";
    if (isAgg) {
      const peer = g.members.filter(m => m.startsWith("[")).length;
      const native = g.members.filter(m => m !== "DIRECT" && !m.startsWith("[")).length;
      extra = `本订阅 ${native} · 对端 ${peer}`;
      if (d2.agg_engaged) extra += ' · <span class="tag direct">正在承载流量</span>';
      else extra += ' · <span class="tag skip">未承载（在主选择组选中「聚合」即接管）</span>';
    } else if (g.has_agg) {
      extra = '含聚合选项';
    }
    return `<tr${isAgg ? ' style="background:#1a2233"' : ''}>
      <td>${esc(g.name)}</td>
      <td>${esc(g.type)}</td><td>${esc(g.now)}</td><td>${g.members.length}</td>
      <td>${extra}</td></tr>`;
  });
  $("groups").innerHTML = `<table><tr><th>组</th><th>类型</th><th>当前选中</th><th>成员数</th><th>构成</th></tr>${rows.join("")}</table>`;
}

async function loadMirrors() {
  const d2 = await j("/api/mirrors");
  const badge = st => st === "mirrored" ? '<span class="tag direct">镜像</span>'
    : st === "official" ? '<span class="tag skip">官方</span>'
    : st === "custom" ? '<span class="tag action">自定义</span>'
    : '<span class="tag skip">未安装</span>';
  $("mirrors").innerHTML = `<table><tr><th>服务</th><th>状态</th><th>当前源</th><th>检测来源</th></tr>` +
    d2.items.map(m => `<tr><td>${esc(m.service)}</td><td>${badge(m.state)}</td>
      <td style="max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.source)}</td>
      <td style="color:var(--dim)">${esc(m.via)}</td></tr>`).join("") + `</table>`;
}

async function loadTimeline() {
  const t = await j("/api/timeline");
  const rows = [];
  for (const x of (t.judgments || [])) {
    rows.push(`<tr><td>${new Date(x.ts * 1000).toLocaleString()}</td>
      <td><span class="tag ${x.action === "revert" ? "skip" : "action"}">${esc(x.kind)}</span></td>
      <td>${esc(x.target)}</td><td>${esc(x.action)}</td><td>${esc(x.reason)}</td></tr>`);
  }
  for (const e of (t.shadow || [])) {
    const v = e.verdict;
    const conclusion = v.action ? `<span class="tag action">${esc(v.action)}</span>`
      : `<span class="tag skip">跳过：${esc(v.skipped)}</span>`;
    rows.push(`<tr><td>${new Date(e.at).toLocaleString()}</td>
      <td><span class="tag skip">影子</span></td>
      <td>${esc(v.host)}</td><td>${conclusion}</td><td>${esc(v.evidence)}</td></tr>`);
  }
  $("timeline").innerHTML = rows.length
    ? `<table><tr><th>时间</th><th>类型</th><th>目标</th><th>结论</th><th>依据</th></tr>${rows.slice(0, 30).join("")}</table>`
    : `<div class="empty">暂无判定输出（数据积累中；判定每 5 分钟运行）</div>`;
}

async function loadNodes() {
  const ns = await j("/api/nodes");
  if (!ns.length) { $("nodes").innerHTML = `<div class="empty">健康探测预热中（60s/轮）</div>`; return; }
  const maxScore = Math.max(...ns.map(n => n.score), 1);
  const rows = ns.slice(0, 24).map(n => `<tr>
    <td>${esc(n.group)}</td><td>${esc(n.node)}</td>
    <td>${n.ewma_ms.toFixed(0)}ms</td>
    <td>×${n.penalty}</td>
    <td class="${n.consec_fail >= 2 ? "red" : ""}">${n.consec_fail} 败 / ${n.consec_slow} 慢</td>
    <td><div class="bar"><i style="width:${Math.min(n.score / maxScore * 100, 100)}%;background:${n.score > 1000 ? "var(--red)" : n.score > 300 ? "var(--yellow)" : "var(--green)"}"></i></div></td>
    <td>${n.score.toFixed(0)}</td></tr>`);
  $("nodes").innerHTML = `<table><tr><th>组</th><th>当前节点</th><th>EWMA</th><th>罚分</th><th>连续状态</th><th>score</th><th></th></tr>${rows.join("")}</table>`;
}

async function loadMatrix() {
  const rows = await j("/api/matrix");
  const lat = rows.filter(r => r.ewma_ms > 0);
  if (!lat.length) { $("matrix").innerHTML = `<div class="empty">延迟回填预热中（30min 采样周期，启动即有首轮）</div>`; return; }
  const maxMs = Math.max(...lat.map(r => r.p95_ms || r.ewma_ms), 1);
  const html = lat.slice(0, 20).map(r => `<tr>
    <td>${esc(r.host)}</td>
    <td><span class="tag ${r.via}">${r.via}</span></td>
    <td class="${cls(r.ewma_ms)}">${r.ewma_ms.toFixed(0)}ms</td>
    <td>${(r.p95_ms || 0).toFixed(0)}ms</td>
    <td>${(r.fail_rate * 100).toFixed(1)}%</td>
    <td>${r.n}</td>
    <td><div class="bar"><i style="width:${Math.min((r.ewma_ms / maxMs) * 100, 100)}%;background:${cls(r.ewma_ms) === "red" ? "var(--red)" : cls(r.ewma_ms) === "yellow" ? "var(--yellow)" : "var(--green)"}"></i></div></td></tr>`);
  $("matrix").innerHTML = `<table><tr><th>域名</th><th>路径</th><th>EWMA</th><th>P95</th><th>失败率</th><th>样本</th><th></th></tr>${html.join("")}</table>`;
}

async function loadEvidence() {
  const list = await j("/api/evidence");
  if (!list.length) { $("evidence").innerHTML = `<div class="empty">尚无自愈动作（影子模式下正式动作才会产出证据）</div>`; return; }
  $("evidence").innerHTML = `<table><tr><th>文件</th><th>时间</th><th>大小</th></tr>` +
    list.map(f => `<tr class="row-click" onclick="viewEv('${esc(f.name)}')">
      <td><a href="javascript:void(0)">${esc(f.name)}</a></td>
      <td>${f.time}</td><td>${f.size}</td></tr>`).join("") + `</table>`;
}

async function viewEv(name) {
  const r = await fetch("/api/evidence?name=" + encodeURIComponent(name));
  const pre = $("ev-content");
  pre.style.display = "block";
  pre.textContent = await r.text();
}

async function refresh() {
  try {
    await Promise.all([loadOverview(), loadDeps(), loadGroups(), loadMirrors(), loadTimeline(), loadNodes(), loadMatrix(), loadEvidence()]);
    $("refresh").textContent = "更新于 " + new Date().toLocaleTimeString() + " · 每 10s 自动刷新";
  } catch (e) { $("refresh").textContent = "刷新失败：" + e; }
}
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
